name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Newer "latest" regressed node_modules materialization on x64.
          bun-version: "1.4.0"

      - name: Install system build deps (node-pty / native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # Hardlink backend fails to materialize node_modules on this bun/x64 combo.
      - name: Install dependencies
        run: bun install --backend copy

      - name: Run test matrix
        env:
          NEXUS_FULL_TESTS: "1"
        run: bash script/test-lowmem.sh

  release:
    name: Publish GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

  build:
    name: Build linux-arm64 binary
    needs: [test, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Newer "latest" regressed node_modules materialization on x64.
          bun-version: "1.4.0"

      - name: Install system build deps (node-pty / native modules)
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      # Hardlink backend fails to materialize node_modules on this bun/x64 combo.
      - name: Install dependencies
        run: bun install --backend copy

      - name: Build linux-arm64 binary
        env:
          NEXUS_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${NEXUS_VERSION#v}"
          NEXUS_VERSION="$VERSION" bun run --cwd packages/nexus script/build.ts --target=linux-arm64
          tar -czf "nexus-linux-arm64-${VERSION}.tar.gz" -C packages/nexus/dist/nexus-linux-arm64/bin nexus

      - name: Upload binary to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" "nexus-linux-arm64-${VERSION}.tar.gz" --clobber
